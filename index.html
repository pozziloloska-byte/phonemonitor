<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>PhoneMonitor</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@800&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#07090c;
  --panel:#0c1017;
  --border:#18222e;
  --accent:#00e5ff;
  --green:#00ff9d;
  --red:#ff3b5c;
  --text:#b8ccd8;
  --muted:#3a5060;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'JetBrains Mono',monospace;
  height:100vh;
  display:grid;
  grid-template-rows:44px 1fr;
  grid-template-columns:180px 1fr 200px;
  overflow:hidden;
}

/* ── Шапка ── */
header{
  grid-column:1/-1;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 16px;
  gap:14px;
}
.logo{font-family:'Syne',sans-serif;font-size:14px;letter-spacing:.1em;color:var(--accent)}
.logo b{color:var(--green)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);transition:all .3s;flex-shrink:0}
.dot.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.dot.off{background:var(--red);box-shadow:0 0 6px var(--red)}
#hStatus{font-size:11px;color:var(--muted);flex:1}
#fpsBadge{font-size:10px;border:1px solid var(--border);padding:2px 7px;border-radius:3px;color:var(--muted)}

/* ── Боковые панели ── */
.side{
  background:var(--panel);
  border-right:1px solid var(--border);
  padding:14px 10px;
  display:flex;
  flex-direction:column;
  gap:6px;
  overflow-y:auto;
}
.side.right{border-right:none;border-left:1px solid var(--border)}
.stitle{font-size:9px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;margin:6px 0 2px}
.irow{display:flex;justify-content:space-between;font-size:10px;padding:4px 0;border-bottom:1px solid var(--border)}
.irow span:last-child{color:var(--accent)}

.btn{
  width:100%;padding:8px 10px;
  background:transparent;
  border:1px solid var(--border);
  border-radius:5px;
  color:var(--text);
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  cursor:pointer;
  text-align:left;
  display:flex;align-items:center;gap:7px;
  transition:border-color .15s,color .15s,background .15s;
}
.btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(0,229,255,.04)}
.btn:active{background:rgba(0,229,255,.1)}
.btn .i{width:18px;text-align:center;font-size:14px}

#textInput{
  width:100%;background:var(--bg);
  border:1px solid var(--border);border-radius:5px;
  color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px;
  padding:7px;resize:none;height:54px;outline:none;
  transition:border-color .15s;
}
#textInput:focus{border-color:var(--accent)}

.hr{height:1px;background:var(--border);margin:4px 0}

/* ── Экран ── */
.viewport{
  background:#000;
  position:relative;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;cursor:crosshair;
  user-select:none;
}
#screen{max-width:100%;max-height:100%;object-fit:contain;display:none;pointer-events:none}

.nosig{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;color:var(--muted);font-size:11px;
}
.nosig svg{width:44px;height:44px;opacity:.25}

/* Тап индикатор */
@keyframes tap{0%{transform:scale(1);opacity:1}100%{transform:scale(3.5);opacity:0}}
.tapring{
  position:fixed;width:18px;height:18px;border-radius:50%;
  border:2px solid var(--accent);pointer-events:none;
  transform:translate(-50%,-50%);
  animation:tap .35s ease-out forwards;
}

/* Линия свайпа */
#swipeCanvas{position:absolute;inset:0;pointer-events:none;display:none}

/* scrollbar */
.side::-webkit-scrollbar{width:3px}
.side::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>

<header>
  <div class="logo">PHONE<b>MONITOR</b></div>
  <div class="dot" id="dot"></div>
  <div id="hStatus">Ожидание...</div>
  <div id="fpsBadge">-- fps</div>
</header>

<!-- Левая панель -->
<div class="side">
  <div class="stitle">Статус</div>
  <div class="irow"><span>Телефон</span><span id="iPhone">—</span></div>
  <div class="irow"><span>Стрим</span><span id="iStream">—</span></div>
  <div class="irow"><span>Кадров</span><span id="iFrames">0</span></div>

  <div style="margin-top:auto">
    <div class="stitle">Клавиши</div>
    <div style="font-size:10px;color:var(--muted);line-height:2">
      <b style="color:var(--text)">Esc</b> Назад<br>
      <b style="color:var(--text)">H</b> Домой<br>
      <b style="color:var(--text)">R</b> Последние<br>
      <b style="color:var(--text)">↑↓←→</b> Свайп
    </div>
  </div>
</div>

<!-- Экран телефона -->
<div class="viewport" id="vp">
  <img id="screen" src="/stream" alt="">
  <div class="nosig" id="nosig">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
      <rect x="5" y="2" width="14" height="20" rx="2.5"/>
      <line x1="9" y1="7" x2="15" y2="7"/><circle cx="12" cy="17" r="1.2"/>
    </svg>
    <span>Нет сигнала</span>
    <span style="font-size:9px;opacity:.6">Запусти приложение на телефоне</span>
  </div>
  <canvas id="swipeCanvas"></canvas>
</div>

<!-- Правая панель -->
<div class="side right">
  <div class="stitle">Навигация</div>
  <button class="btn" onclick="cmd({type:'back'})"><span class="i">←</span>Назад</button>
  <button class="btn" onclick="cmd({type:'home'})"><span class="i">⬜</span>Домой</button>
  <button class="btn" onclick="cmd({type:'recents'})"><span class="i">▣</span>Последние</button>

  <div class="hr"></div>
  <div class="stitle">Свайпы</div>
  <button class="btn" onclick="qswipe('up')"><span class="i">↑</span>Вверх</button>
  <button class="btn" onclick="qswipe('down')"><span class="i">↓</span>Вниз</button>
  <button class="btn" onclick="qswipe('left')"><span class="i">←</span>Влево</button>
  <button class="btn" onclick="qswipe('right')"><span class="i">→</span>Вправо</button>

  <div class="hr"></div>
  <div class="stitle">Текст</div>
  <textarea id="textInput" placeholder="Введи текст..."></textarea>
  <button class="btn" onclick="sendText()" style="border-color:var(--accent);color:var(--accent)">
    <span class="i">⌨</span>Отправить
  </button>
</div>

<script>
// ── WebSocket ─────────────────────────────────────────────────────────────────
let ws, swipeStart=null, totalFrames=0, fps=0, fpsTimer=0;

function connectWS(){
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${proto}://${location.host}/ws/browser`);
  ws.onclose=()=>setTimeout(connectWS,2000);
}
connectWS();

function cmd(obj){
  if(ws&&ws.readyState===WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

// ── Статус ────────────────────────────────────────────────────────────────────
function pollStatus(){
  fetch('/status').then(r=>r.json()).then(s=>{
    const on=s.phone_control;
    document.getElementById('dot').className='dot '+(on?'on':'off');
    document.getElementById('hStatus').textContent=on?'Телефон подключён':'Телефон не подключён';
    document.getElementById('iPhone').textContent=on?'online':'offline';
    document.getElementById('iStream').textContent=s.streaming?'идёт':'нет';

    const sc=document.getElementById('screen');
    const ns=document.getElementById('nosig');
    if(s.streaming){sc.style.display='block';ns.style.display='none';}
    else{sc.style.display='none';ns.style.display='flex';}
  }).catch(()=>{});
}
setInterval(pollStatus,2000);pollStatus();

// ── FPS ───────────────────────────────────────────────────────────────────────
document.getElementById('screen').addEventListener('load',()=>{
  totalFrames++;fps++;
  const now=Date.now();
  if(now-fpsTimer>=1000){
    document.getElementById('fpsBadge').textContent=fps+' fps';
    document.getElementById('iFrames').textContent=totalFrames;
    fps=0;fpsTimer=now;
  }
});

// ── Тап / свайп мышью ────────────────────────────────────────────────────────
const vp=document.getElementById('vp');
const sc=document.getElementById('screen');

function relCoords(e){
  const r=sc.getBoundingClientRect();
  return{x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height};
}

vp.addEventListener('mousedown',e=>{
  if(e.target!==vp&&e.target!==sc) return;
  const rc=relCoords(e);
  swipeStart={cx:e.clientX,cy:e.clientY,rx:rc.x,ry:rc.y};
  e.preventDefault();
});

vp.addEventListener('mouseup',e=>{
  if(!swipeStart) return;
  const dx=e.clientX-swipeStart.cx, dy=e.clientY-swipeStart.cy;
  const dist=Math.hypot(dx,dy);
  const rc=relCoords(e);
  if(dist<8){
    cmd({type:'tap',x:swipeStart.rx,y:swipeStart.ry});
    showTap(e.clientX,e.clientY);
  } else {
    cmd({type:'swipe',x:swipeStart.rx,y:swipeStart.ry,x2:rc.x,y2:rc.y});
  }
  swipeStart=null;
});

function showTap(x,y){
  const el=document.createElement('div');
  el.className='tapring';
  el.style.cssText=`left:${x}px;top:${y}px`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),380);
}

function qswipe(dir){
  const m={
    up:   {x:.5,y:.8,x2:.5,y2:.15},
    down: {x:.5,y:.15,x2:.5,y2:.8},
    left: {x:.85,y:.5,x2:.15,y2:.5},
    right:{x:.15,y:.5,x2:.85,y2:.5},
  };
  cmd({type:'swipe',...m[dir]});
}

function sendText(){
  const v=document.getElementById('textInput').value.trim();
  if(v){cmd({type:'text',value:v});document.getElementById('textInput').value='';}
}

// ── Горячие клавиши ───────────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(document.activeElement===document.getElementById('textInput')) return;
  const map={Escape:'back',h:'home',H:'home',r:'recents',R:'recents',
    ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
  const a=map[e.key];
  if(!a) return;
  if(['up','down','left','right'].includes(a)) qswipe(a);
  else cmd({type:a});
  e.preventDefault();
});
</script>
</body>
</html>
