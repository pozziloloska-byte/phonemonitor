<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

  :root {
    --bg: #090909;
    --surface: #111111;
    --border: #1e1e1e;
    --accent: #00ff88;
    --accent2: #ff3c3c;
    --text: #e8e8e8;
    --muted: #444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* Сканлайн эффект */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
    pointer-events: none;
    z-index: 1000;
  }

  header {
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 0.1em;
    color: var(--accent);
    text-transform: uppercase;
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
  }

  .dot.online { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 2s infinite; }
  .dot.offline { background: var(--accent2); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 24px;
    gap: 24px;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
  }

  /* Экран телефона */
  .screen-wrap {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }

  .screen-wrap::before {
    content: 'LIVE';
    position: absolute;
    top: 12px;
    left: 12px;
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 0.2em;
    z-index: 10;
    background: rgba(0,0,0,0.7);
    padding: 3px 8px;
    border: 1px solid var(--accent);
  }

  .fps-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
    z-index: 10;
    background: rgba(0,0,0,0.7);
    padding: 3px 8px;
    border: 1px solid var(--border);
  }

  #screen {
    width: 100%;
    display: block;
    min-height: 200px;
    background: #000;
    object-fit: contain;
  }

  .no-signal {
    width: 100%;
    min-height: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.1em;
  }

  .no-signal-icon {
    font-size: 48px;
    opacity: 0.2;
  }

  /* Кнопки управления */
  .controls {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
  }

  .btn-start {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    background: var(--accent);
    color: #000;
    border: none;
    padding: 16px 32px;
    cursor: pointer;
    transition: all 0.15s;
    border-radius: 2px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn-start:hover { background: #00ffaa; transform: translateY(-1px); }
  .btn-start:active { transform: translateY(0); }
  .btn-start:disabled { background: var(--muted); color: #222; cursor: not-allowed; transform: none; }

  .btn-start.loading {
    background: #004422;
    color: var(--accent);
    border: 1px solid var(--accent);
    cursor: wait;
  }

  .nav-buttons {
    display: flex;
    gap: 8px;
  }

  .btn-nav {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 12px 16px;
    cursor: pointer;
    transition: all 0.15s;
    border-radius: 2px;
    letter-spacing: 0.05em;
  }

  .btn-nav:hover { border-color: var(--accent); color: var(--accent); }
  .btn-nav:active { background: #1a1a1a; }

  /* Лог */
  .log {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 16px;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.8;
    max-height: 120px;
    overflow-y: auto;
  }

  .log-line { display: flex; gap: 12px; }
  .log-time { color: #333; min-width: 60px; }
  .log-msg.ok { color: var(--accent); }
  .log-msg.err { color: var(--accent2); }
  .log-msg.info { color: var(--muted); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 12px 20px;
    font-size: 12px;
    letter-spacing: 0.05em;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.2s;
    pointer-events: none;
    z-index: 999;
    border-radius: 2px;
  }

  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.ok { border-color: var(--accent); color: var(--accent); }
  .toast.err { border-color: var(--accent2); color: var(--accent2); }
</style>
</head>
<body>

<header>
  <div class="logo">⬡ Monitor</div>
  <div class="status-pill">
    <div class="dot" id="dot"></div>
    <span id="status-text">Проверка...</span>
  </div>
</header>

<main>
  <div class="screen-wrap" id="screen-wrap">
    <div class="fps-badge" id="fps-badge">-- fps</div>
    <div class="no-signal" id="no-signal">
      <div class="no-signal-icon">📵</div>
      <div>НЕТ СИГНАЛА</div>
      <div style="font-size:10px;">Нажми ЗАПУСТИТЬ чтобы начать</div>
    </div>
    <img id="screen" style="display:none;" alt="screen">
  </div>

  <div class="controls">
    <button class="btn-start" id="btn-start" onclick="startCapture()">
      <span id="btn-icon">▶</span>
      <span id="btn-label">ЗАПУСТИТЬ</span>
    </button>
    <div class="nav-buttons">
      <button class="btn-nav" onclick="sendCmd('back')">← назад</button>
      <button class="btn-nav" onclick="sendCmd('home')">⌂</button>
      <button class="btn-nav" onclick="sendCmd('recents')">▣</button>
    </div>
  </div>

  <div class="log" id="log">
    <div class="log-line"><span class="log-time">--:--:--</span><span class="log-msg info">Ожидание подключения телефона...</span></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  let streaming = false;
  let frameCount = 0;
  let lastFpsTime = Date.now();
  let phoneOnline = false;

  // ── Поллинг кадров ──────────────────────────────────
  function pollFrames() {
    if (!streaming) return;
    const img = document.getElementById('screen');
    const url = '/latest.jpg?t=' + Date.now();
    const tmp = new Image();
    tmp.onload = () => {
      img.src = url;
      img.style.display = 'block';
      document.getElementById('no-signal').style.display = 'none';
      frameCount++;
    };
    tmp.src = url;
    setTimeout(pollFrames, 66); // 15fps
  }

  // ── FPS счётчик ──────────────────────────────────────
  setInterval(() => {
    const now = Date.now();
    const fps = Math.round(frameCount / ((now - lastFpsTime) / 1000));
    document.getElementById('fps-badge').textContent = fps + ' fps';
    frameCount = 0;
    lastFpsTime = now;
  }, 2000);

  // ── Статус телефона ──────────────────────────────────
  async function checkStatus() {
    try {
      const r = await fetch('/status');
      const d = await r.json();
      phoneOnline = d.online;
      const dot = document.getElementById('dot');
      const txt = document.getElementById('status-text');
      if (d.online) {
        dot.className = 'dot online';
        txt.textContent = 'Телефон онлайн';
      } else {
        dot.className = 'dot offline';
        txt.textContent = 'Телефон офлайн';
      }
    } catch(e) {
      document.getElementById('dot').className = 'dot';
      document.getElementById('status-text').textContent = 'Сервер недоступен';
    }
  }

  setInterval(checkStatus, 3000);
  checkStatus();

  // ── Запустить стриминг ───────────────────────────────
  async function startCapture() {
    const btn = document.getElementById('btn-start');
    const icon = document.getElementById('btn-icon');
    const label = document.getElementById('btn-label');

    btn.disabled = true;
    btn.classList.add('loading');
    icon.textContent = '⟳';
    label.textContent = 'ЗАПУСК...';

    addLog('Отправляю команду на телефон...', 'info');

    try {
      const r = await fetch('/start', { method: 'POST' });
      const d = await r.json();

      if (d.ok) {
        addLog('Команда отправлена — телефон открывает диалог', 'ok');
        showToast('Команда отправлена!', 'ok');

        // Даём время на диалог (~1.5 сек) потом начинаем показывать кадры
        setTimeout(() => {
          streaming = true;
          pollFrames();
          icon.textContent = '■';
          label.textContent = 'СТОП';
          btn.classList.remove('loading');
          btn.disabled = false;
          btn.onclick = stopCapture;
          addLog('Стриминг запущен', 'ok');
        }, 1500);
      } else {
        addLog('Ошибка: ' + (d.error || 'нет ответа'), 'err');
        showToast(d.error || 'Телефон не подключён', 'err');
        resetBtn();
      }
    } catch(e) {
      addLog('Ошибка соединения с сервером', 'err');
      showToast('Сервер недоступен', 'err');
      resetBtn();
    }
  }

  function stopCapture() {
    streaming = false;
    const img = document.getElementById('screen');
    img.style.display = 'none';
    document.getElementById('no-signal').style.display = 'flex';
    document.getElementById('fps-badge').textContent = '-- fps';
    addLog('Стриминг остановлен', 'info');
    resetBtn();
  }

  function resetBtn() {
    const btn = document.getElementById('btn-start');
    btn.disabled = false;
    btn.classList.remove('loading');
    btn.onclick = startCapture;
    document.getElementById('btn-icon').textContent = '▶';
    document.getElementById('btn-label').textContent = 'ЗАПУСТИТЬ';
  }

  // ── Команды управления ───────────────────────────────
  async function sendCmd(type, extra = {}) {
    try {
      await fetch('/cmd', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({type, ...extra})
      });
    } catch(e) {}
  }

  // ── Тап по экрану ────────────────────────────────────
  document.getElementById('screen').addEventListener('click', (e) => {
    const rect = e.target.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;
    sendCmd('tap', {x, y});
  });

  // ── Лог ─────────────────────────────────────────────
  function addLog(msg, type = 'info') {
    const log = document.getElementById('log');
    const now = new Date();
    const t = now.toTimeString().slice(0,8);
    const line = document.createElement('div');
    line.className = 'log-line';
    line.innerHTML = `<span class="log-time">${t}</span><span class="log-msg ${type}">${msg}</span>`;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }

  // ── Toast ────────────────────────────────────────────
  function showToast(msg, type = 'ok') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    setTimeout(() => t.className = 'toast', 2500);
  }
</script>
</body>
</html>
